<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IJBMRS Article Index</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official article index of the International Journal of Business and Management Research Studies" />

  <meta name="citation_journal_title" content="International Journal of Business and Management Research Studies">

  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #ffffff;
      color: #222;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
    }

    header {
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    header p {
      color: #555;
      font-size: 1.05rem;
    }

    .article {
      border-top: 1px solid #ddd;
      padding: 25px 0;
    }

    .article:first-child {
      border-top: none;
    }

    .article h2 {
      font-size: 1.3rem;
      margin-bottom: 5px;
      color: #003366;
    }

    .authors {
      font-style: italic;
      margin-bottom: 10px;
    }

    .journal-meta {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 10px;
    }

    .extra-meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    .actions a {
      display: inline-block;
      margin-right: 15px;
      font-size: 0.95rem;
      color: #003366;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .actions a:hover {
      border-bottom: 1px solid #003366;
    }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>International Journal of Business and Management Research Studies</h1>
    <p>Official Article Index</p>
  </header>

  <main id="article-list">
    <p>No articles indexed yet.</p>
  </main>

  <footer>
    <p>© IJBMRS | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
